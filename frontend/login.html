<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Atendimento</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f0f2f5; height:100vh; display:flex; align-items:center; justify-content:center; }
.card { background:white; padding:40px; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,.1); width:380px; text-align:center; }
.logo { max-width:160px; max-height:60px; margin-bottom:28px; display:block; margin-left:auto; margin-right:auto; }
.card input { width:100%; padding:12px; margin-bottom:12px; border:1px solid #ddd; border-radius:8px; font-size:15px; outline:none; transition:border-color .2s; }
.card input:focus { border-color:#25d366; }
.card button { width:100%; padding:12px; background:#25d366; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer; font-weight:600; transition:background .2s; }
.card button:hover { background:#128C7E; }
.erro { color:#e74c3c; font-size:14px; margin-bottom:12px; display:none; }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="/logo.webp" alt="Logo">
  <div class="erro" id="erro"></div>
  <input type="text" id="username" placeholder="Usuário" autocomplete="off">
  <input type="password" id="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<script>
function setAuthCookie(token) {
  if (!token) return;
  document.cookie = `auth_token=${encodeURIComponent(token)}; path=/; SameSite=Lax`;
}

async function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const erro = document.getElementById('erro');

  if (!username || !password) {
    erro.textContent = 'Preencha usuário e senha';
    erro.style.display = 'block';
    return;
  }

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (!res.ok) {
      erro.textContent = data.error;
      erro.style.display = 'block';
      return;
    }

    localStorage.setItem('token', data.token);
    localStorage.setItem('role', data.role);
    setAuthCookie(data.token);

    if (data.role === 'admin') {
      window.location.href = '/admin.html';
    } else {
      window.location.href = '/vendor.html';
    }
  } catch (err) {
    erro.textContent = 'Erro de conexão';
    erro.style.display = 'block';
  }
}

document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
