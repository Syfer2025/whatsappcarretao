<!DOCTYPE html>
<html lang="pt-br">
<head>
<script>
  (function(){try{var t=localStorage.getItem('theme');if(t!=='dark'&&t!=='light'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
</script>
<script src="/theme.js" defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esqueci a Senha - WhatsApp AI</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f0f2f5; height:100vh; display:flex; align-items:center; justify-content:center; }
.card { background:white; padding:40px; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,.1); width:380px; text-align:center; }
.brand { font-size:22px; font-weight:700; color:#075e54; margin-bottom:24px; }
.brand span { color:#25d366; }
.card h2 { font-size:20px; margin-bottom:4px; }
.card .sub { font-size:13px; color:#667781; margin-bottom:24px; }
.card input { width:100%; padding:12px; margin-bottom:12px; border:1px solid #ddd; border-radius:8px; font-size:15px; outline:none; }
.card input:focus { border-color:#25d366; }
.card button { width:100%; padding:12px; background:#25d366; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer; font-weight:600; }
.card button:hover { background:#128C7E; }
.card button:disabled { opacity:.5; cursor:not-allowed; }
.msg { font-size:13px; margin-bottom:12px; display:none; padding:10px; border-radius:8px; }
.msg.ok { display:block; background:#e8f5e9; color:#2e7d32; }
.msg.erro { display:block; background:#fbe9e7; color:#c62828; }
.footer { margin-top:16px; font-size:13px; color:#667781; }
.footer a { color:#25d366; text-decoration:none; font-weight:600; }

/* ===== Tema escuro ===== */
[data-theme="dark"] { color-scheme: dark; }
[data-theme="dark"] body { background:#0b141a; color:#e9edef; }
[data-theme="dark"] .card { background:#111b21; box-shadow:0 10px 40px rgba(0,0,0,0.5); }
[data-theme="dark"] .brand { color:#e9edef; }
[data-theme="dark"] .card h2 { color:#e9edef; }
[data-theme="dark"] .card .sub { color:#8696a0; }
[data-theme="dark"] .card input { background:#202c33; border-color:rgba(255,255,255,0.14); color:#e9edef; }
[data-theme="dark"] .footer { color:#8696a0; }
[data-theme="dark"] .msg.ok { background:rgba(37,211,102,0.14); color:#7fe0a3; }
[data-theme="dark"] .msg.erro { background:rgba(241,92,109,0.14); color:#f6a6ad; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span>WhatsApp</span> AI</div>
  <h2>Esqueci a senha</h2>
  <p class="sub">A recuperação de administradores é analisada pelo super admin. Vendedores devem pedir a troca ao administrador da própria empresa.</p>
  <div id="msg" class="msg"></div>
  <form onsubmit="handleForgot(event)">
    <input type="email" id="email" placeholder="Seu email de login" required>
    <button type="submit" id="btn">Solicitar nova senha</button>
  </form>
  <div class="footer">
    <a href="/login.html">Voltar ao login</a>
  </div>
</div>
<script>
async function handleForgot(e) {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  msg.className = 'msg';
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  try {
    const res = await fetch('/api/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      msg.textContent = data.error || 'Não foi possível enviar a solicitação. Tente novamente.';
      msg.className = 'msg erro';
    } else {
      msg.textContent = data.message || 'Se a conta puder ser recuperada, a solicitação foi enviada ao responsável.';
      msg.className = 'msg ok';
    }
  } catch {
    msg.textContent = 'Erro de conexao';
    msg.className = 'msg erro';
  }
  btn.disabled = false;
  btn.textContent = 'Solicitar nova senha';
}

fetch('/api/branding').then(r=>r.json()).then(b=>{if(b.appName)document.title='Esqueci a Senha - '+b.appName;}).catch(()=>{});
</script>
</body>
</html>
