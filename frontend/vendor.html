async function selectConv(id, options = {}) {
  window.ChatShell?.openConversation();
  const selectionRequestId = ++conversationSelectionSeq;
  cancelReply(true);
  closeConversationSearch();
  closeMessageActionMenus();
  showingFavorites = false;
  updateConversationViewTabs();
  const shouldResetMessages = Number(loadedMessagesConversationId) !== Number(id) || activeMediaFilter !== '';
  currentConvId = id;
  updateSyncMessagesButton();
  pendingHighlightMessageId = options.targetMessageId || null;
  lastRenderedConversationId = null;
  lastRenderedMessageSignature = '';
  activeMediaFilter = '';
  if (shouldResetMessages) resetLoadedMessageState();
  document.getElementById('mediaFilter').value = '';
  document.getElementById('typingStatus').textContent = '';
  document.getElementById('noSelection').style.display = 'none';
  document.getElementById('chatContainer').style.display = 'flex';

  const view = showingArchived ? 'archived' : 'active';
  const convs = cachedConversations.length
    ? cachedConversations
    : await fetchConversationPage(conversationsPagePath(view, 0));
  if (selectionRequestId !== conversationSelectionSeq || id !== currentConvId) return;
  const conv = convs.find(c => c.id === id);
  document.getElementById('chatName').textContent = conv ? displayName(conv) : '...';
  // conv.phone guarda o identificador @lid do WhatsApp, que nao e telefone.
  // O numero real vem de display_phone (ver schema.js). Vazio quando nao ha
  // @c.us conhecido: melhor a linha em branco que um numero inventado.
  document.getElementById('chatPhone').textContent =
    window.ChatDirectory?.formatPhone(window.ChatDirectory?.conversationPhone(conv)) || '';
  const avatarSlot = document.getElementById('chatAvatarSlot');
  avatarSlot.innerHTML = renderAvatar(conv || {}, true);
  setupAvatarFallbacks(avatarSlot);
  const archiveButton = document.getElementById('archiveConversationBtn');
  const isArchived = Number(conv?.whatsapp_archived) === 1;
  archiveButton.dataset.archived = isArchived ? '1' : '0';
  const archiveLabel = archiveButton.querySelector('[data-action-label]');
  if (archiveLabel) archiveLabel.textContent = isArchived ? 'Desarquivar' : 'Arquivar';
  archiveButton.title = isArchived ? 'Desarquivar conversa' : 'Arquivar conversa';
  updateMuteConversationButton(conv?.muted_until);
  document.getElementById('msgInput').value = conv?.draft_text || '';
  autoResizeComposer();
  await loadMessages(id, { force: true });
  if (selectionRequestId !== conversationSelectionSeq || id !== currentConvId) return;
  syncSelectedConversation(id);
  await loadConversations({ force: true });
}

function updateSyncMessagesButton() {
  const button = document.getElementById('syncMessagesBtn');
  if (!button) return;
  const conversationId = Number(currentConvId);
  const hasConversation = Number.isSafeInteger(conversationId) && conversationId > 0;
  const syncing = hasConversation && manualConversationSyncs.has(conversationId);
  button.disabled = syncing || !hasConversation;
  button.setAttribute('aria-busy', syncing ? 'true' : 'false');
  button.textContent = syncing ? 'Sincronizando...' : 'Sincronizar mensagens';
}

function requestConversationSync(id) {
  const conversationId = Number(id);
  const pending = conversationSyncRequests.get(conversationId);
  if (pending) return pending;
  const task = (async () => {
    try {
      const response = await api(`/api/conversations/${conversationId}/sync`, { method: 'POST' });
      const data = await response.json().catch(() => ({}));
      return { ok: response.ok, status: response.status, data };
    } finally {
      conversationSyncRequests.delete(conversationId);
    }
  })();
  conversationSyncRequests.set(conversationId, task);
  return task;
}

async function syncSelectedConversation(id) {
  try {
    const result = await requestConversationSync(id);
    if (!result.ok) {
      if (id === currentConvId) {
        showVendorWarning(result.data.error || 'Não foi possível sincronizar esta conversa com o WhatsApp.');
      }
      return;
    }
    if (id !== currentConvId) return;
    const stats = result.data.stats || {};
    if (Number(stats.messagesImported || 0) || Number(stats.messagesUpdated || 0) || Number(stats.newConversations || 0)) {
      await loadMessages(id, { force: true });
      await loadConversations({ force: true });
    }
  } catch {
    if (id === currentConvId) showVendorWarning('Não foi possível sincronizar esta conversa com o WhatsApp.');
  }
}

async function syncCurrentConversation() {
  const id = Number(currentConvId);
  if (!Number.isSafeInteger(id) || id <= 0) {
    showVendorWarning('Abra uma conversa antes de sincronizar as mensagens.');
    return;
  }
  manualConversationSyncs.add(id);
  updateSyncMessagesButton();
  try {
    const result = await requestConversationSync(id);
    if (!result.ok) {
      throw new Error(result.data.error || 'Não foi possível sincronizar esta conversa com o WhatsApp.');
    }
    if (id !== Number(currentConvId)) return;
    const stats = result.data.stats || {};
    const changed = Number(stats.messagesImported || 0) + Number(stats.messagesUpdated || 0);
    await loadMessages(id, { force: true, preserveScroll: true });
    await loadConversations({ force: true });
    showChatSuccess(changed > 0
      ? `Sincronização concluída: ${changed} mensagem${changed === 1 ? '' : 's'} atualizada${changed === 1 ? '' : 's'}.`
      : 'Esta conversa já está sincronizada.');
  } catch (error) {
    if (id === Number(currentConvId)) {
      showVendorWarning(error.message || 'Não foi possível sincronizar esta conversa com o WhatsApp.');
    }
  } finally {
    manualConversationSyncs.delete(id);
    updateSyncMessagesButton();
  }
}

async function loadMessages(id, { force = false, preserveScroll = false } = {}) {
  const requestId = ++messageLoadSeq;
  const generation = ++messageListGeneration;
  let msgs;
  try {
    const res = await api(messagesUrl(id));
    if (!res.ok) throw new Error('Não foi possível carregar as mensagens desta conversa.');
    msgs = await res.json();
    if (!Array.isArray(msgs)) throw new Error('Resposta de mensagens inválida.');
  } catch (error) {
    if (requestId === messageLoadSeq && id === currentConvId) {
      showVendorWarning(error.message || 'Não foi possível carregar as mensagens desta conversa.');
    }
    return;
  }
  if (requestId !== messageLoadSeq || id !== currentConvId) return;
  if (generation !== messageListGeneration) return;

  const preservesLoadedPages = loadedMessagesConversationId === id && loadedMessagesFilter === activeMediaFilter;
  const nextMessages = mergeMessagesById(preservesLoadedPages ? loadedMessages : [], msgs);
  rememberMessageTargets(msgs);
  const signature = messagesSignature(nextMessages);
  if (!force && lastRenderedConversationId === id && lastRenderedMessageSignature === signature) {
    if (pendingHighlightMessageId && await ensureMessageTargetVisible(pendingHighlightMessageId)) pendingHighlightMessageId = null;
    await markConversationRead(id);
    return;
  }

  const list = document.getElementById('messagesList');
  const distanceFromBottom = list.scrollHeight - list.scrollTop - list.clientHeight;
  const shouldScrollToBottom = !preserveScroll || distanceFromBottom < 120;
  loadedMessages = nextMessages;
  loadedMessagesConversationId = id;
  loadedMessagesFilter = activeMediaFilter;
  oldestLoadedMessageId = loadedMessages[0]?.id || null;
  const shouldAnchorAfterMedia = shouldScrollToBottom && !pendingHighlightMessageId;
  cancelActiveMediaAnchor();
  list.innerHTML = renderMessageList(loadedMessages);
  lastRenderedConversationId = id;
  lastRenderedMessageSignature = signature;
  if (shouldScrollToBottom) setMessageScrollTopImmediately(list, list.scrollHeight);
  if (!preservesLoadedPages) updateLoadOlderButton(msgs.length);
  if (pendingHighlightMessageId && await ensureMessageTargetVisible(pendingHighlightMessageId)) pendingHighlightMessageId = null;
  if (shouldAnchorAfterMedia) anchorMessagesAfterMediaMetadata(list, id);
  await markConversationRead(id);
}

function anchorMessagesAfterMediaMetadata(list, conversationId) {
  cancelActiveMediaAnchor();
  let active = true;
  let cleanupTimer = null;
  let remainingMedia = 0;
  const settledMedia = new WeakSet();
  const pendingMedia = Array.from(list.querySelectorAll('audio, video, img')).filter(media => (
    media.tagName === 'IMG' ? !media.complete : Number(media.readyState || 0) < 1
  ));

  const cleanup = () => {
    if (!active) return;
    active = false;
    clearTimeout(cleanupTimer);
    list.removeEventListener('wheel', cleanup);
    list.removeEventListener('touchstart', cleanup);
    list.removeEventListener('pointerdown', cleanup);
    document.removeEventListener('keydown', cancelOnScrollKey, true);
    pendingMedia.forEach(media => {
      media.removeEventListener(media.tagName === 'IMG' ? 'load' : 'loadedmetadata', settleMedia);
      media.removeEventListener('error', settleMedia);
    });
    if (activeMediaAnchorCleanup === cleanup) activeMediaAnchorCleanup = null;
  };
  const cancelOnScrollKey = event => {
    if (!['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' '].includes(event.key)) return;
    if (event.target?.closest?.('input, textarea, select, [contenteditable="true"]')) return;
    cleanup();
  };
  const anchor = () => {
    if (!active) return;
    if (Number(currentConvId) !== Number(conversationId)) {
      cleanup();
      return;
    }
    setMessageScrollTopImmediately(list, list.scrollHeight);
    markConversationRead(conversationId);
  };

  const settleMedia = event => {
    const media = event.currentTarget;
    if (!active || settledMedia.has(media)) return;
    settledMedia.add(media);
    remainingMedia -= 1;
    anchor();
    if (remainingMedia === 0) window.requestAnimationFrame(cleanup);
  };

  remainingMedia = pendingMedia.length;
  pendingMedia.forEach(media => {
    media.addEventListener(media.tagName === 'IMG' ? 'load' : 'loadedmetadata', settleMedia, { once: true });
    media.addEventListener('error', settleMedia, { once: true });
  });
  list.addEventListener('wheel', cleanup, { passive: true });
  list.addEventListener('touchstart', cleanup, { passive: true });
  list.addEventListener('pointerdown', cleanup, { passive: true });
  document.addEventListener('keydown', cancelOnScrollKey, true);
  activeMediaAnchorCleanup = cleanup;
  cleanupTimer = setTimeout(cleanup, 30000);
  window.requestAnimationFrame(anchor);
  if (remainingMedia === 0) window.requestAnimationFrame(cleanup);
}

function isConversationNearBottom() {
  const list = document.getElementById('messagesList');
  if (!list) return false;

  try {

async function toggleCurrentConversationArchive() {
  if (!currentConvId) return;
  const archived = document.getElementById('archiveConversationBtn').dataset.archived !== '1';
  await window.ChatDirectory?.setArchived(currentConvId, archived);
}

async function handleArchiveChanged(conversation) {
  const archived = Number(conversation?.whatsapp_archived) === 1;
  if (Number(conversation?.id) === Number(currentConvId)) {
    const button = document.getElementById('archiveConversationBtn');
    button.dataset.archived = archived ? '1' : '0';
    const label = button.querySelector('[data-action-label]');
    if (label) label.textContent = archived ? 'Desarquivar' : 'Arquivar';
    button.title = archived ? 'Desarquivar conversa' : 'Arquivar conversa';
  }
  await loadConversations({ force: true });
}

async function handleNewConversationOpen(conversationId) {
  showingFavorites = false;
  showingArchived = false;
  updateConversationViewTabs();
  await loadConversations({ force: true });
  await selectConv(Number(conversationId));
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  if (!currentConvId || sendingMessage) return;
  if (!input.value.trim() && !selectedFiles.length) return;
  const conversationId = Number(currentConvId);
  const attempt = getOrCreateSendAttempt(conversationId);
  if (!attempt.tasks.length) return;
  let shouldRefresh = false;
  let activeTask = null;
  setMessageSendingState(true);
  try {
    for (const task of [...attempt.tasks]) {
      if (pendingSendAttempt !== attempt) break;
      activeTask = task;
      setSendTaskStatus(task, '');
      const payload = await materializeMessagePayload(task);
      const res = await api(`/api/conversations/${conversationId}/messages`, {
        method: 'POST', body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Erro ao enviar mensagem');
      shouldRefresh = true;
      const outcome = classifyDeliveryStatus(data.delivery_status);
      if (outcome === 'failed') {
        // O backend conserva a tentativa que falhou. A próxima repetição recebe
        // um novo ID, criado uma única vez agora, e o reutiliza até obter resposta.
        task.clientRequestId = createClientRequestId();
        setSendTaskStatus(task, 'failed');
        throw new Error(data.delivery_error || 'O envio falhou. O conteúdo foi mantido para tentar novamente.');
      }
      if (outcome === 'uncertain') {
        setSendTaskStatus(task, 'uncertain');
        throw new Error('Envio sem confirmação do WhatsApp. O conteúdo foi mantido e a repetição usa o mesmo identificador para não criar outra cópia. Sincronize a conversa antes de reenviar.');
      }
      await completeSendTask(attempt, task);
      activeTask = null;
      if (pendingSendAttempt !== attempt && attempt.tasks.length) break;
    }
    renderRecordingStatus('');
    if (shouldRefresh && conversationId === Number(currentConvId)) {
      await loadMessages(currentConvId, { force: true });
    }
    if (shouldRefresh) await loadConversations({ force: true });
  } catch (error) {
    if (activeTask?.fileItem && !activeTask.fileItem.sendStatus) {
      setSendTaskStatus(activeTask, 'failed');
    }
    if (shouldRefresh && conversationId === Number(currentConvId)) {
      await loadMessages(currentConvId, { force: true }).catch(() => {});
    }
    if (shouldRefresh) await loadConversations({ force: true }).catch(() => {});
    showVendorWarning(error.message || 'Erro ao enviar mensagem');
  } finally {
    setMessageSendingState(false);
  }
}

function sendPayloadsSequentially(tasks) {
  return tasks.filter(task => task.content || task.fileItem);
}

function realtimeConversationId(event) {
  const value = event && typeof event === 'object'
    ? (event.conversationId ?? event.conversation_id ?? event.id)
    : event;
  if (value == null || value === '') return null;
  const numericValue = Number(value);
  return Number.isFinite(numericValue) ? numericValue : null;
}

function setupRealtime() {
  const messagesList = document.getElementById('messagesList');
  messagesList.addEventListener('click', event => {
    const target = event.target.closest?.('[data-media-preview-url]');
    if (!target) return;
    openMediaPreview(
      event,
      decodeURIComponent(target.dataset.mediaPreviewUrl || ''),
      decodeURIComponent(target.dataset.mediaPreviewFilename || 'Anexo')
    );
  });
  messagesList.addEventListener('error', event => {
    const target = event.target;
    if (!target?.closest?.('.media-block') || !['IMG', 'AUDIO', 'VIDEO'].includes(target.tagName)) return;
    const block = target.closest('.media-block');
    block.classList.add('media-unavailable');
    block.textContent = 'Mídia não carregou; sincronização será tentada novamente.';
  }, true);
  socket.on('connect', () => {
    scheduleConversationRefresh();
    if (currentConvId) scheduleMessageRefresh();
  });
  socket.on('connect_error', () => {});
  socket.on('connection:status', applyConnectionStatus);
  socket.on('conversation:updated', event => {
    scheduleConversationRefresh();
    const conversationId = realtimeConversationId(event);
    if (currentConvId && (conversationId == null || conversationId === Number(currentConvId))) {
      scheduleMessageRefresh();
    }
  });
  socket.on('message:new', event => {
    scheduleConversationRefresh();
    if (currentConvId && Number(event.conversationId) === Number(currentConvId)) {
      scheduleMessageRefresh();
    }
  });
  socket.on('notification:new', event => {
    showBrowserNotification(event);
    scheduleConversationRefresh();
  });
  socket.on('typing:update', applyTypingStatus);
}

setupEmojiPicker();
setupRealtime();
window.ChatDirectory?.configure({
  api,
  notify: (message, type) => type === 'success'
    ? setConnectionBanner('ok', message, 3500)
    : showVendorWarning(message),
  onConversationOpen: handleNewConversationOpen,
  onArchiveChanged: handleArchiveChanged
});
window.StickerLibrary?.configure({
  api,
  getCurrentConversationId: () => currentConvId,
  notify: (message, type) => type === 'success'
    ? showChatSuccess(message)
    : showVendorWarning(message),
  onSent: async ({ conversationId }) => {
    if (Number(conversationId) === Number(currentConvId)) {
      await loadMessages(currentConvId, { force: true, preserveScroll: true });
    }
    await loadConversations({ force: true });
  }
});
init();
monitorConnection();
loadConversations();
</script>

<div id="mediaPreview" class="media-preview" onclick="closeMediaPreview()">
  <button class="media-preview-close" onclick="event.stopPropagation();closeMediaPreview()">&times;</button>
  <img id="mediaPreviewImg" src="" alt="">
  <div class="media-preview-caption" id="mediaPreviewCaption"></div>
</div>

<script>
function openMediaPreview(event, url, caption) {
  if (event) event.stopPropagation();
  document.getElementById('mediaPreviewImg').src = url;
  document.getElementById('mediaPreviewCaption').textContent = caption || '';
  document.getElementById('mediaPreview').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeMediaPreview() {
  document.getElementById('mediaPreview').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeMediaPreview();
});
</script>
</body>
